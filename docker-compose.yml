services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: 7golden
      POSTGRES_PASSWORD: 7golden
      POSTGRES_DB: 7golden
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 7golden -d 7golden"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://7golden:7golden@db:5432/7golden?schema=public"
      JWT_SECRET: "7golden-docker-secret-change-me"
      PORT: "3001"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      UPLOAD_DIR: "/app/uploads"
      PUBLIC_URL: "http://localhost:3001"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: "http://backend:3001"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend-uploads:
