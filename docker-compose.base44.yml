services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: 7golden
      POSTGRES_PASSWORD: 7golden
      POSTGRES_DB: 7golden
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 7golden -d 7golden"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://7golden:7golden@db:5432/7golden?schema=public"
      JWT_SECRET: "7golden-dev-secret-change-me-0123456789"
      PORT: "3001"
      CORS_ORIGIN: "*"
      UPLOAD_DIR: "/app/uploads"
      PUBLIC_URL: "http://localhost:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "apk add --no-cache openssl >/dev/null 2>&1; npm install --no-audit --no-fund && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts; exec npx tsx watch src/index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s

  frontend:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:5173"
    environment:
      VITE_PROXY_TARGET: "http://backend:3001"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/backend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  backend-uploads:
