services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Public app id (already hardcoded in src/api/base44Client.js); lets app-params resolve it.
      VITE_BASE44_APP_ID: "6a9ea5d67a95141fb1f84b4a"
      # Base44 cloud API — the vite plugin proxies relative /api calls here (SDK's default serverUrl).
      VITE_BASE44_APP_BASE_URL: "https://base44.app"
      # Vite >= 6.1 appends this to allowedHosts (platform sets it).
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}"
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  node_modules:
