name: CI and Deploy to 7Golden Server

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7golden-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7golden-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy frontend to server
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    # Configure the required GitHub Actions secrets before enabling production deployment.
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: 7golden-frontend-dist
          path: dist/

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          FRONTEND_WEB_ROOT: ${{ secrets.FRONTEND_WEB_ROOT }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS FRONTEND_WEB_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          if [[ ! "$FRONTEND_WEB_ROOT" =~ ^/[a-zA-Z0-9._/-]+$ ]] || [[ "$FRONTEND_WEB_ROOT" == *"/../"* ]] || [[ "$FRONTEND_WEB_ROOT" == */.. ]]; then
            echo "::error::FRONTEND_WEB_ROOT must be a safe absolute path without shell metacharacters or parent-directory traversal"
            exit 1
          fi
          case "$FRONTEND_WEB_ROOT" in
            /|/var/www|/var/www/html|/var/www/7golden|/var/www/7golden/)
              echo "::error::Refusing generic web roots and the project source directory; target the exact frontend document root (for example, a dedicated dist directory)"
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy built frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_WEB_ROOT: ${{ secrets.FRONTEND_WEB_ROOT }}
        run: |
          set -euo pipefail
          export RSYNC_RSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p -- '$FRONTEND_WEB_ROOT'"
          rsync -az --delete --delay-updates -e "$RSYNC_RSH" dist/ "$SSH_USER@$SSH_HOST:$FRONTEND_WEB_ROOT/"

      - name: Verify deployed frontend responds
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL repository variable is not set; skipping HTTP smoke check."
            exit 0
          fi
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --location --max-time 10 "$DEPLOY_URL" >/dev/null; then
              echo "Deployment HTTP smoke check passed."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Deployed frontend did not pass the HTTP smoke check"
          exit 1
